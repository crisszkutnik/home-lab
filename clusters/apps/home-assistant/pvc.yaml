apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  # The K3s default StorageClass stores the volume on the node where the pod
  # first runs. To move to cloud-backed storage later, install the CSI driver
  # of your provider, change this value, and copy the existing data (or
  # restore a Home Assistant backup into the new volume).
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
