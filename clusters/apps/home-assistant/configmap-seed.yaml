apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-seed
  namespace: home-assistant
  labels:
    app: home-assistant
data:
  # Home Assistant 2026.8+ stores the HTTP server settings (port,
  # trusted proxies, ...) in .storage/http and no longer reads them from
  # configuration.yaml. The init container copies this file to
  # /config/.storage/http only if it does not exist yet, so the ingress
  # works on the very first boot without a manual UI step. After that,
  # change these values in Settings > System > Network.
  # The format below matches the Home Assistant 2026.11 storage schema;
  # later versions migrate older stores automatically.
  http.json: |
    {
      "version": 3,
      "minor_version": 1,
      "key": "http",
      "data": {
        "stable": {
          "server_port": 8123,
          "cors_allowed_origins": ["https://cast.home-assistant.io"],
          "login_attempts_threshold": -1,
          "ip_ban_enabled": true,
          "ssl_profile": "intermediate_v6",
          "use_x_frame_options": true,
          "use_x_forwarded_for": true,
          "trusted_proxies": [
            "10.42.0.0/16",
            "10.43.0.0/16",
            "127.0.0.0/8",
            "::1/128"
          ],
          "created_at": "2026-11-05T00:00:00.000000+00:00",
          "error": null,
          "error_message": null
        },
        "pending": null,
        "yaml_migration_done": true
      }
    }
  # Copied to /config/configuration.yaml only on the very first start.
  # After that the file lives on the PVC and can be edited freely (the
  # container does not overwrite it).
  configuration.yaml: |
    # Loads the default set of integrations.
    default_config:

    # Themes live on the PVC, so they can be added later without touching
    # this file.
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    homeassistant:
      time_zone: America/Argentina/Buenos_Aires
      # Cluster-managed YAML settings live in /config/packages.
      packages: !include_dir_named packages
