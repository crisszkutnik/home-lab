apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-home-assistant
  namespace: home-assistant
  annotations:
    # Home Assistant keeps a WebSocket open for live updates and backups can
    # be large, so raise the proxy timeouts and body size.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    # Home Assistant does not support being served from a sub-path, so it
    # owns the root of the private host. Longer paths (/grafana, ...) still
    # take precedence over this rule. Cloudflare Access protects the host.
    - host: private-k8s.cristobalszk.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
